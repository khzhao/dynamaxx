[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[project]
name = "dynamaxx"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dask>=2026.6.0",
    "jax[cuda13]>=0.10.1",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pint>=0.25.3",
    "s3fs>=2026.4.0",
    "scikit-learn>=1.9.0",
    "tree-math>=0.2.1",
    "xarray>=2026.4.0",
    "zarr>=2.18.7,<3",
]

[project.scripts]
dynamaxx-eval = "dynamaxx.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit>=4.6.0",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.ruff]
src = ["src"]
include = ["src/**/*.py"]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
preview = true

isort = { known-first-party = ["dynamaxx"] }

select = [
  "C",
  "E",
  "F",
  "I",
  "W",
  "CPY001",
  "RUF013",
  "UP006",
  "PERF102",
  "PLC1802",
  "PLC0208",
  "D",
  "RUF002",
  "DOC102",
  "DOC202",
  "DOC403",
  "DOC502",
]

ignore = [
  "C901", # complex structure / mccabe complexity
  "E501", # line-too-long (formatter handles)
  "E741", # ambiguous variable name
  "D100", # Missing docstring in public module
  "D102", # Missing docstring in public method
  "D104", # Missing docstring in public package
  "D105", # Missing docstring in magic method
  "D107", # Missing docstring in __init__
  "D203", # conflict with D211
  "D213", # conflict with D212
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403"]
"src/dynamaxx/dycore/models/dinosaur/**/*.py" = [
  "C408", # preserve upstream container-constructor style in vendored code
  "C419", # preserve upstream comprehension style in vendored code
  "D101", # upstream public classes do not all carry local-style docstrings
  "D103", # upstream public functions do not all carry local-style docstrings
  "D205", # preserve upstream docstring layout during parity migration
  "E731", # upstream uses named lambdas for local tree-map helpers
  "RUF002", # scientific docstrings intentionally use Greek/math symbols
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[tool.pyrefly.errors]
missing-argument = false
missing-attribute = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests that touch external services or large runtime paths",
    "weatherbench2: tests that read the real WeatherBench2 dataset",
]
